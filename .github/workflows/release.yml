name: Release

# Pushing a tag like v0.1.0 tests on every operating system, builds the archives, runs each native binary,
# and publishes a GitHub release. "Run workflow" (manual) does everything except publish: the archives are
# kept as a workflow artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Version
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            # The tag becomes file names and a version string: only a plain version is a release.
            if ! printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "tag ${GITHUB_REF_NAME} is not a version like v1.2.3 or v1.2.3-rc.1" >&2
              exit 1
            fi
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build archives
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/package.sh "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Run the binary that was just built on the system it was built for.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: linux_amd64.tar.gz
          - os: macos-latest
            archive: darwin_arm64.tar.gz
          - os: windows-latest
            archive: windows_amd64.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Unpack, check and run
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          file="substrate_${TAG#v}_${{ matrix.archive }}"
          grep " $file\$" checksums.txt | (sha256sum -c - 2>/dev/null || shasum -a 256 -c -)
          case "$file" in
            *.zip) unzip -q "$file"; bin=substrate.exe ;;
            *) tar -xzf "$file"; bin=substrate ;;
          esac
          "./$bin" version | grep "$TAG"
          ../scripts/smoke.sh "./$bin"

  release:
    if: github.ref_type == 'tag'
    needs: [test, build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/substrate_* dist/checksums.txt \
            --title "$TAG" --generate-notes --verify-tag
