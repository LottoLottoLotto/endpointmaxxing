name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build archives
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            stage="$(mktemp -d)"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X github.com/LottoLottoLotto/substrate/internal/cli.Version=${TAG}" \
              -o "$stage/substrate" ./cmd/substrate
            cp LICENSE NOTICE README.md "$stage/"
            tar -C "$stage" -czf "dist/substrate_${version}_${goos}_${goarch}.tar.gz" \
              substrate LICENSE NOTICE README.md
            rm -rf "$stage"
          done
          (cd dist && sha256sum substrate_*.tar.gz > checksums.txt)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/substrate_*.tar.gz dist/checksums.txt \
            --title "$TAG" --generate-notes --verify-tag
