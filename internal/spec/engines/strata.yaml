spec: emx.engine/v1
id: strata
name: Strata
description: >-
  MoE expert-offloading engine for Qwen3.8-Flash-Next on consumer GPUs. A model is a
  strata-<model>.json config written by Strata's setup.sh; context, KV and expert placement live there.
homepage: https://github.com/Niko1221/Strata

binary:
  env: STRATA_PYTHON
  # The entry point is the Strata checkout's virtualenv python; {root} is the checkout.
  candidates:
    - ~/Strata/.venv/bin/python
    - "{data}/engines/strata/.venv/bin/python"

vars:
  root: "{bin_dir}/../.."
  # Strata ports (e.g. the Tenstorrent tree) ship their own server; override per install.
  server: serve/server.py

install:
  notes: Strata's setup.sh asks for the model size and context, downloads ~70 GB and writes the config to pass to `emx model add`.
  steps:
    - git clone --depth 1 https://github.com/Niko1221/Strata "{data}/engines/strata" || git -C "{data}/engines/strata" pull --ff-only
    - cd "{data}/engines/strata" && ./setup.sh --setup

launch:
  command: ["{bin}", "{root}/{server}", --engine, strata, --config, "{model_path}", --host, "{host}", --port, "{port}"]
  cwd: "{root}"
  stop_signal: SIGTERM
  stop_timeout: 60s
  # The key travels in the environment, not on the command line (the process list is readable by every user).
  api_key_env: STRATA_API_KEY

health:
  path: /health
  timeout: 20m

# The context window, as the server reports it for the model it serves.
context:
  path: /v1/models
  field: data.0.meta.n_ctx

# Whether the loaded model takes images.
vision:
  path: /v1/models
  field: data.0.architecture.input_modalities

# How many requests decode together: 1 unless the Strata config sets "parallel".
slots:
  path: /props
  field: total_slots

flags:
  gpus: [--gpu, "{value}"]

capabilities:
  formats: [strata-config]
  quantizations: ["*"]
  apis: [chat, responses, messages]
  features: [moe-offload, vision, speculative, kv-quant, multi-gpu]

routing:
  priority: {strata-config: 100}

# Strata fills free VRAM with its expert cache: it needs whole GPUs.
memory: {mode: exclusive}
