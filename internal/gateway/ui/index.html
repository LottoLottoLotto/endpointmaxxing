<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EndpointMaxxing admin</title>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<header>
  <span class="brand">emx</span>
  <nav id="nav">
    <a href="#overview">Overview</a>
    <a href="#models">Models</a>
    <a href="#mesh">Mesh</a>
    <a href="#requests">Requests</a>
    <a href="#events">Events</a>
    <a href="#policy">Policy</a>
    <a href="#access">Keys &amp; teams</a>
    <a href="#config">Config</a>
  </nav>
  <span class="spacer"></span>
  <span id="who" class="who"></span>
  <button id="signout" class="link" hidden>Sign out</button>
</header>

<main id="main"></main>

<dialog id="login">
  <form id="login-form">
    <h2>Sign in</h2>
    <p>Enter an <b>admin</b> or <b>auditor</b> API key. It is kept in this tab only and sent as a bearer token.</p>
    <input id="login-key" type="password" autocomplete="off" placeholder="API key" required>
    <p id="login-error" class="error"></p>
    <button type="submit">Sign in</button>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>
</body>
</html>
